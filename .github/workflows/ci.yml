name: Statistics and real-data reproduction
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check src tests
      - run: decision-lab download
      - run: pytest -q
      - run: decision-lab run
      - uses: actions/upload-artifact@v4
        with:
          name: readouts-python-${{ matrix.python }}
          path: |
            reports/**/*.json
            reports/**/*.md
            reports/**/*.png
            reports/**/comparisons.csv
            reports/**/metrics.csv
